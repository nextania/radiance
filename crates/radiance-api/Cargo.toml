[package]
name = "radiance-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
actix-web = "4.12.1"
radiance-types = { path = "../radiance-types" }
radiance-control = { path = "../radiance-control" }
argon2 = "0.5.3"
openidconnect = "4.0.1"
toml = "0.9.11"
base64 = "0.22.1"
mongodb = "3.4.1"
rustls = { version = "0.23.36", features = ["ring"] }
actix-files = "0.6.10"
once_cell = "1.21.3"
lazy_static = "1.5.0"
futures-util = "0.3.31"
dashmap = "6.1.0"
ulid = "1.2.1"
rand = "0.9.2"
